[package]
name = "rdb-driver-oracle"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
rdb-core = { path = "../core" }
async-trait = "0.1"
chrono = "0.4"
oracle = { version = "0.6", features = ["chrono"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "time"] }

[dev-dependencies]
testcontainers = "0.27"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
