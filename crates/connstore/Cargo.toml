[package]
name = "rdbs-connstore"
version = "0.1.0"
edition = "2021"

[dependencies]
rdbs-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
directories = "6"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.11"
rand = "0.10"

[dev-dependencies]
tempfile = "3"
