[package]
name = "dbm-driver-postgres"
version = "0.1.0"
edition = "2021"

[dependencies]
dbm-core = { path = "../core" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
serde_json = "1"
