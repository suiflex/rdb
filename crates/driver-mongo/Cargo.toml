[package]
name = "rdb-driver-mongo"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
rdb-core = { path = "../core" }
async-trait = "0.1"
mongodb = "3"
serde_json = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mongo"] }
