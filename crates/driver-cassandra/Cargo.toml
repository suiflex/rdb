[package]
name = "rdb-driver-cassandra"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
rdb-core = { path = "../core" }
async-trait = "0.1"
scylla = { version = "1", features = ["rustls-023"] }
rustls = "0.23"
webpki-roots = "0.26"

[dev-dependencies]
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
