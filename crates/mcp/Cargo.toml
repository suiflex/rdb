[package]
name = "rdb-mcp"
version = "0.49.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "rdb-mcp"
path = "src/main.rs"

[dependencies]
rdb-core = { path = "../core" }
rdb-connstore = { path = "../connstore" }
rdb-runtime = { path = "../runtime" }
rmcp = { version = "3.6", features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "0.62", features = ["visitor"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[dev-dependencies]
tempfile = "3"
