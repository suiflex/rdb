[package]
name = "rdb-agent"
version = "0.49.0"
edition = "2021"
license.workspace = true

[dependencies]
rdb-core = { path = "../core" }
rdb-connstore = { path = "../connstore" }
rdb-runtime = { path = "../runtime" }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "time", "process"] }
sqlparser = { version = "0.62", features = ["visitor"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
