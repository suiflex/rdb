[package]
name = "rdbs-driver-mysql"
version = "0.1.0"
edition = "2021"

[dependencies]
rdbs-core = { path = "../core" }
async-trait = "0.1"
mysql_async = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mysql"] }
