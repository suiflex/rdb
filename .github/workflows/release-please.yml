name: release-please

on:
  # A maintainer starts release preparation explicitly after batching changes.
  workflow_dispatch:
  # A merged release PR is finalized automatically into a tag and release.
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # Manual runs prepare/update the release PR. Pull request runs only
    # finalize a merged Release Please PR, never an application PR.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The tag stays vX.Y.Z (release-build.yml keys off `v*`); only the
      # GitHub Release display title gets the "RDB " prefix. Manifest mode
      # path-prefixes the release outputs for every package except the root
      # one, which the action emits unprefixed — so this reads the bare
      # `release_created` now that the package is rooted at the repo.
      - name: Prefix release title with product name
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          gh release edit "${{ steps.release.outputs.tag_name }}" \
            --title "RDB ${{ steps.release.outputs.tag_name }}"

      # release-please builds the Release body from its own plain changelog
      # notes. By the time a release is created the enriched block (per-line
      # @handles + Thanks + New Contributors, added by the fold step below on
      # each feature-PR merge) is already on develop, which this job has
      # checked out. Replace the body with that block so the credited notes
      # are what people see on the Release page. Skip if the block is missing
      # or has no section yet, so a race can't wipe the notes.
      - name: Use the credited changelog block as the Release body
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          version="${TAG#v}"
          awk -v h="## RDB: [$version](" '
            index($0, h) == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ -s release-notes.md ] && grep -q '^### ' release-notes.md; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            echo "no credited block for $version yet; leaving the body as-is"
          fi
          rm -f release-notes.md

      # We keep CHANGELOG.md at the repo root, but release-please resolves
      # `changelog-path` relative to its package dir and rejects `..`. The
      # package is rooted at the repo, so the config points it at
      # app/CHANGELOG.md and this step folds that into the root file
      # (prefixing the heading to match the release title) and drops the
      # package copy. app/CHANGELOG.md is rewritten from scratch every run,
      # so it holds exactly the section being released — that's what the
      # version is taken from, rather than the root file where a rebased
      # branch could leave an unrelated block on top.
      #
      # Use the action output when it created or updated a PR. The label is
      # applied just before this step and may not yet be visible to search,
      # which previously let a successful run leave app/CHANGELOG.md behind.
      # Fall back to the label for a pre-existing PR that this run did not
      # rewrite, so later pushes still heal an earlier failed fold.
      - name: Fold CHANGELOG into the repo root
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName // empty' <<<"$RELEASE_PR")
          if [ -z "$branch" ]; then
            branch=$(gh pr list --state open --label "autorelease: pending" \
              --json headRefName --jq '.[0].headRefName')
          fi
          if [ -z "$branch" ]; then
            echo "no open release PR; nothing to fold"
            exit 0
          fi
          # Copy the scripts out before switching branches: the release branch
          # is only rebuilt when release-please rewrites it, so it can carry an
          # older copy of these scripts than the commit that triggered this run.
          # fold_changelog.py splices release-please's section into the root
          # file; attribute_changelog.py then credits contributors in that
          # newest block (per-line @handles, a Thanks list, New Contributors).
          scripts=$(mktemp -d)
          cp .github/scripts/fold_changelog.py \
             .github/scripts/attribute_changelog.py "$scripts"/
          git fetch origin "$branch"
          git checkout "$branch"
          python3 "$scripts/fold_changelog.py"
          python3 "$scripts/attribute_changelog.py"
          rm -f app/CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md app/CHANGELOG.md; then
            echo "CHANGELOG already folded into the root"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CHANGELOG.md app/CHANGELOG.md
          git commit -m "docs: fold and attribute changelog"
          git push origin "$branch"
