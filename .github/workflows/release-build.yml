name: release-build

# A version-tag push builds the release and updates all distribution channels.
# workflow_dispatch is an npm-only recovery path for an existing release tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish to npm
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            target: aarch64-apple-darwin
            ext: tar.gz
            native_asset: rdb-aarch64-apple-darwin.dmg
          - os: macos-14 # cross-compile Intel on Apple Silicon (no scarce macos-13)
            target: x86_64-apple-darwin
            ext: tar.gz
            native_asset: rdb-x86_64-apple-darwin.dmg
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            native_asset: rdb-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm # native GitHub arm64 linux runner
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
            native_asset: rdb-aarch64-unknown-linux-gnu
            experimental: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
            native_asset: rdb-x86_64-pc-windows-msvc.exe
          - os: windows-11-arm # native GitHub arm64 windows runner
            target: aarch64-pc-windows-msvc
            ext: zip
            native_asset: rdb-aarch64-pc-windows-msvc.exe
            experimental: true
    runs-on: ${{ matrix.os }}
    # experimental arm legs are best-effort: a failure must not fail the `build`
    # job (publish-* depend on it) so the release still gets published.
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
      # ponytail: same minimal Slint deps as the CI workflow; extend if the
      # build errors demanding another lib.
      - name: Install Slint system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgtk-3-dev
      - name: Build release binary
        run: cargo build --release -p rdb --target ${{ matrix.target }}
      # Keep the archives for Homebrew/Scoop, and also publish files users can
      # launch directly from the GitHub Release page.
      - name: Package archive (unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "rdb-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" rdb
      - name: Package app (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          app="RDB.app"
          plist="$app/Contents/Info.plist"
          iconset="$RUNNER_TEMP/RDB.iconset"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$iconset"
          cp "target/${{ matrix.target }}/release/rdb" "$app/Contents/MacOS/rdb"

          icon="app/assets/icon@512.png"
          sips -z 16 16 "$icon" --out "$iconset/icon_16x16.png"
          sips -z 32 32 "$icon" --out "$iconset/icon_16x16@2x.png"
          sips -z 32 32 "$icon" --out "$iconset/icon_32x32.png"
          sips -z 64 64 "$icon" --out "$iconset/icon_32x32@2x.png"
          sips -z 128 128 "$icon" --out "$iconset/icon_128x128.png"
          sips -z 256 256 "$icon" --out "$iconset/icon_128x128@2x.png"
          sips -z 256 256 "$icon" --out "$iconset/icon_256x256.png"
          sips -z 512 512 "$icon" --out "$iconset/icon_256x256@2x.png"
          sips -z 512 512 "$icon" --out "$iconset/icon_512x512.png"
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/RDB.icns"

          plutil -create xml1 "$plist"
          plutil -insert CFBundleDisplayName -string RDB "$plist"
          plutil -insert CFBundleExecutable -string rdb "$plist"
          plutil -insert CFBundleIconFile -string RDB.icns "$plist"
          plutil -insert CFBundleIdentifier -string com.suiflex.rdb "$plist"
          plutil -insert CFBundleName -string RDB "$plist"
          plutil -insert CFBundlePackageType -string APPL "$plist"
          plutil -insert CFBundleShortVersionString -string "${VERSION#v}" "$plist"
          plutil -insert CFBundleVersion -string "${VERSION#v}" "$plist"
          plutil -insert NSHighResolutionCapable -bool true "$plist"

          codesign --force --deep --sign - "$app"
          hdiutil create -volname RDB -srcfolder "$app" -ov -format UDZO \
            "${{ matrix.native_asset }}"
      - name: Package executable (Linux)
        if: runner.os == 'Linux'
        run: |
          install -m 755 "target/${{ matrix.target }}/release/rdb" \
            "${{ matrix.native_asset }}"
      - name: Package executables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item `
            -Path "target/${{ matrix.target }}/release/rdb.exe" `
            -Destination "${{ matrix.native_asset }}"
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/rdb.exe" `
            -DestinationPath "rdb-${{ matrix.target }}.zip"
      - name: Upload asset to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" \
            "rdb-${{ matrix.target }}.${{ matrix.ext }}" \
            "${{ matrix.native_asset }}" --clobber

  # ---- publish jobs: siblings, both need `build`, neither needs the other ----
  # A failure in one does NOT cancel the other (GitHub only cancels a job's own
  # dependents). Single shared PAT: secrets.TAP_PUBLISH_TOKEN.

  update-website-release:
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refresh website release data
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm --prefix website run fetch-release
      - name: Open and merge website release data PR
        env:
          # develop is a protected ruleset that forbids direct pushes for every
          # actor (PR required, no bypass), so route the change through a PR and
          # merge it. Website files need 0 approvals and no required checks, so
          # the merge lands immediately. RELEASE_PLEASE_TOKEN has repo + PR write.
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if git diff --quiet -- website/src/data/release.json; then
            echo "website release data already current"
            exit 0
          fi
          branch="chore/website-release-${{ github.ref_name }}"
          pr_number="$(gh pr list --base develop --head "$branch" --state open --json number --jq '.[0].number // ""')"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add website/src/data/release.json
          git commit -m "docs: update website release data for ${{ github.ref_name }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch origin "+refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "$branch"
          if [ -z "$pr_number" ]; then
            pr_url="$(gh pr create --base develop --head "$branch" \
              --title "docs: update website release data for ${{ github.ref_name }}" \
              --body "Automated release-data refresh for ${{ github.ref_name }}.")"
            pr_number="${pr_url##*/}"
          fi
          # Merge once GitHub has computed mergeability (no auto-merge on this
          # repo). Plain merge commit, not --squash: this repo's ruleset has
          # squash merges disabled entirely (allow_squash_merge: false).
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$pr_number" --merge --delete-branch; then
              exit 0
            fi
            echo "merge not ready yet, retrying…"; sleep 5
          done
          echo "::error::failed to merge website release data PR"; exit 1

  publish-homebrew:
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render formula and push to tap
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"

          dl() { gh release download "$TAG" -R "$REPO" -p "$1" -O "$1" --clobber; }
          sha() { shasum -a 256 "$1" | cut -d' ' -f1; }

          # The formula is Linux-only; macOS is served by the cask below.
          dl "rdb-x86_64-unknown-linux-gnu.tar.gz"
          linux_sha="$(sha rdb-x86_64-unknown-linux-gnu.tar.gz)"

          # DMGs carry the signed RDB.app for the GUI cask.
          dl "rdb-aarch64-apple-darwin.dmg"
          dl "rdb-x86_64-apple-darwin.dmg"
          arm_dmg_sha="$(sha rdb-aarch64-apple-darwin.dmg)"
          intel_dmg_sha="$(sha rdb-x86_64-apple-darwin.dmg)"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks
          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@LINUX_SHA@|${linux_sha}|g" \
              packaging/rdb.rb.tmpl > tap/Formula/rdb.rb
          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@ARM_DMG_SHA@|${arm_dmg_sha}|g" \
              -e "s|@INTEL_DMG_SHA@|${intel_dmg_sha}|g" \
              packaging/rdb-cask.rb.tmpl > tap/Casks/rdb.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/rdb.rb Casks/rdb.rb
          git commit -m "rdb ${VERSION}" || { echo "no change"; exit 0; }
          git push

  # Publishes @suiflex/rdb to npm. The package's postinstall downloads the
  # matching release asset (already uploaded by `build`) at the user's install
  # time, so this job only ships the tiny installer, not the binaries.
  publish-npm:
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    # OIDC Trusted Publishing: no NPM_TOKEN. The npm package trusts this repo +
    # workflow + `Release` environment; GitHub mints a short-lived OIDC token.
    environment: Release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; node 20 ships npm 10.
      # Keep this below npm 12, which no longer supports the Node 20 runner.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.5.2
      # Pin the package version to the release tag so it can never drift from
      # the crate version (release-please's file sync can lag a release).
      - name: Set version from tag
        working-directory: npm
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public

  # Re-publishes only the npm installer for an existing release tag. This is
  # intentionally separate from the tag path: release assets and package taps
  # have already succeeded, so a retry must not rebuild or overwrite them.
  recover-npm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11.5.2
      - name: Set version from tag
        working-directory: npm
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public

  publish-scoop:
    if: github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render manifest and push to bucket
        env:
          GH_TOKEN: ${{ secrets.TAP_PUBLISH_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          base="https://github.com/${REPO}/releases/download/${TAG}"
          asset="rdb-x86_64-pc-windows-msvc.zip"

          gh release download "$TAG" -R "$REPO" -p "$asset" -O "$asset" --clobber
          win_sha="$(shasum -a 256 "$asset" | cut -d' ' -f1)"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/suiflex/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          sed -e "s|@VERSION@|${VERSION}|g" \
              -e "s|@BASE@|${base}|g" \
              -e "s|@WIN_SHA@|${win_sha}|g" \
              packaging/rdb.json.tmpl > bucket/bucket/rdb.json

          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/rdb.json
          git commit -m "rdb ${VERSION}" || { echo "no change"; exit 0; }
          git push
