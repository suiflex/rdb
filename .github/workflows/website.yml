name: website

# CI check only. Deployment is handled by Cloudflare Pages' Git integration,
# which builds and publishes on every push to develop.
on:
  push:
    branches: [develop]
    paths: ["website/**", "wrangler.jsonc"]
  pull_request:
    paths: ["website/**", "wrangler.jsonc"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify Worker name
        working-directory: .
        run: |
          node -e '
            const config = require("fs").readFileSync("wrangler.jsonc", "utf8");
            const name = config.match(/"name"\s*:\s*"([^"]+)"/)?.[1];
            if (name !== "rdb") {
              throw new Error(`wrangler.jsonc name must be rdb, got ${name}`);
            }
          '
      - run: npm ci
      - run: npm run build
      - run: SKIP_NETWORK=1 npm run test
