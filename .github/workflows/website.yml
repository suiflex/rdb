name: website

# CI check only. Deployment is handled by Cloudflare Pages' Git integration,
# which builds and publishes on every push to develop.
on:
  push:
    branches: [develop]
    paths: ["website/**"]
  pull_request:
    paths: ["website/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: SKIP_NETWORK=1 npm run test
