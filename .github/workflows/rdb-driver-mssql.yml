name: rdb-driver-mssql

on:
  push:
    branches: [develop, main]
    paths:
      - crates/driver-mssql/**
      - crates/core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/rdb-driver-mssql.yml
  pull_request:
    paths:
      - crates/driver-mssql/**
      - crates/core/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/rdb-driver-mssql.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rdb-driver-mssql
      - run: cargo fmt -p rdb-driver-mssql --check
      - run: cargo clippy -p rdb-driver-mssql --all-targets -- -D warnings
      - run: cargo test -p rdb-driver-mssql --lib
