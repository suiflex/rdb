name: Bug report
description: Report something that is broken or behaving incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug. Please fill out the fields below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Connect to ...
        3. Run ...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Database engine
      options:
        - PostgreSQL
        - MySQL
        - MariaDB
        - Redis
        - Valkey
        - MongoDB
        - SQLite
        - Cassandra
        - SQL Server
        - Oracle
        - ClickHouse
        - Not engine-specific
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: os-detail
    attributes:
      label: OS version / distro (optional)
      placeholder: e.g. macOS 15.2, Ubuntu 24.04, Windows 11, FreeBSD 14
  - type: input
    id: version
    attributes:
      label: rdb version
      description: Output of `rdb --version`, or the release/commit you are on.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error output. Will be formatted as code automatically.
      render: shell
