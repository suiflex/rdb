# Path -> label map for the PR area labeler (the `label` job in
# .github/workflows/suiflex.yml).
#
# One entry per component, mirroring the per-crate CI workflows: a reviewer can
# tell from the label row which parts of the workspace a pull request touches
# without opening the diff.
#
# Adding a crate means adding it here as well as to the Makefile's BE_PKGS and
# its own workflow — nothing checks that this file stayed in sync.


"area: app":
  - changed-files:
      - any-glob-to-any-file:
          - "app/**"

# Finer areas inside the app, so a reviewer can tell a UI tweak from a wiring
# or updater change without opening the diff. They sit alongside "area: app",
# not instead of it.
"area: app-ui":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/ui/**"
          - "app/assets/**"

"area: app-material":
  - changed-files:
      - any-glob-to-any-file:
          - "app/vendor/material/**"

# Everything vendored, Material included: upstream source carried in-tree and
# patched (see each directory's PATCHES.md), not code written here.
"area: app-vendor":
  - changed-files:
      - any-glob-to-any-file:
          - "app/vendor/**"

"area: app-wiring":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/wire/**"
          - "app/src/main.rs"
          - "app/src/pane.rs"
          - "app/src/dispatch.rs"
          - "app/src/model.rs"

"area: app-editor":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/editor.rs"
          - "app/src/editor/**"
          - "app/src/completion.rs"
          - "app/src/completion/**"
          - "app/src/format.rs"
          - "app/src/format/**"
          - "app/src/query_parse.rs"

"area: app-update":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/update.rs"
          - "app/src/self_update.rs"
          - "app/src/wire/update.rs"

"area: app-harness":
  - changed-files:
      - any-glob-to-any-file:
          - "app/src/mock.rs"
          - "app/src/mock/**"
          - "app/src/shot.rs"

