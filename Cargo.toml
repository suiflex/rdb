[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/connstore",
    "crates/driver-postgres",
    "crates/driver-mysql",
    "crates/driver-redis",
    "crates/driver-mongo",
    "crates/driver-sqlite",
    "crates/driver-cassandra",
    "app",
]

# Size-optimized release profile (target: binary < 15 MB).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
