[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/connstore",
    "crates/driver-postgres",
    "crates/driver-mysql",
    "crates/driver-oracle",
    "crates/driver-redis",
    "crates/driver-mongo",
    "crates/driver-sqlite",
    "crates/driver-cassandra",
    "crates/driver-mssql",
    "crates/driver-clickhouse",
    "crates/tunnel",
    "app",
]
# Vendored upstream source, patched in below: not ours to lint or format.
exclude = ["app/vendor/i-slint-renderer-femtovg"]

# Slint's femtovg renderer with a layer-alignment fix for fractional scale
# factors (whole-UI zoom). See app/vendor/i-slint-renderer-femtovg/PATCHES.md;
# must match the slint version exactly.
[patch.crates-io]
i-slint-renderer-femtovg = { path = "app/vendor/i-slint-renderer-femtovg" }

[workspace.package]
license = "Apache-2.0"

# Size-optimized release profile (target: binary < 15 MB).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Dev builds: keep target/ small. Backtraces still show file:line.
[profile.dev]
debug = "line-tables-only"

# Dependencies rarely need stepping through — no debug info at all.
[profile.dev.package."*"]
debug = false
