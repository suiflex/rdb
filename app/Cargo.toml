[package]
name = "rdb"
version = "0.39.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "rdb"
path = "src/main.rs"

[features]
# Design-parity tooling (seeded MockDriver + RDB_SHOT capture). Non-default so
# release builds exclude ~830 lines of dev-only code.
mock = []

[dependencies]
# 1.17 is the floor, not a nicety: it is the first release with Slint's own
# embedded MCP server, which is how the UI is driven under test. Enable it with
# `--features slint/mcp` on the command line — Slint's own docs are explicit
# that it must not go in this file's `[features]`.
slint = { version = "1.17", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-femtovg", "renderer-software", "raw-window-handle-06"] }
rdb-core = { path = "../crates/core" }
rdb-connstore = { path = "../crates/connstore" }
rdb-driver-postgres = { path = "../crates/driver-postgres" }
rdb-driver-mysql = { path = "../crates/driver-mysql" }
rdb-driver-redis = { path = "../crates/driver-redis" }
rdb-driver-mongo = { path = "../crates/driver-mongo" }
rdb-driver-sqlite = { path = "../crates/driver-sqlite" }
rdb-driver-cassandra = { path = "../crates/driver-cassandra" }
rdb-driver-mssql = { path = "../crates/driver-mssql" }
rdb-driver-clickhouse = { path = "../crates/driver-clickhouse" }
rdb-tunnel = { path = "../crates/tunnel" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# permissive JSON for the Mongo editor: mongosh uses bare keys / single quotes
# (`{_id:-1}`), which strict serde_json rejects.
json5 = "1.3"
async-trait = "0.1"
# clipboard; already in the tree via Slint's winit backend, so no new builds
copypasta = "0.10"
# update check: one blocking GitHub GET (ureq, no async/TLS-stack bloat) +
# semver compare; `open` opens the release page cross-platform.
ureq = "3"
semver = "1"
open = "5"
# native desktop notification nudging the user when an update is out
notify-rust = "4"
# native Save-As dialog for CSV export. xdg-portal drives the Linux backend
# through the XDG Desktop Portal (D-Bus) instead of the unmaintained gtk-rs
# GTK3 bindings; tokio matches the app runtime. macOS/Windows use their
# native panels.
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
# History date-grouping (Today/Yesterday/date): local-timezone civil-date math.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Set the Dock icon even for `cargo run`; macOS ignores a window icon on an
# unbundled executable. These crates are already in Slint's winit dependency tree.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
slint-build = "1.17"

[dev-dependencies]
tempfile = "3"
