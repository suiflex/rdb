[package]
name = "rdbs"
version = "0.13.0"
edition = "2021"

[[bin]]
name = "rdbs"
path = "src/main.rs"

[dependencies]
slint = { version = "1.8", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-femtovg", "renderer-software"] }
rdbs-core = { path = "../crates/core" }
rdbs-connstore = { path = "../crates/connstore" }
rdbs-driver-postgres = { path = "../crates/driver-postgres" }
rdbs-driver-mysql = { path = "../crates/driver-mysql" }
rdbs-driver-redis = { path = "../crates/driver-redis" }
rdbs-driver-mongo = { path = "../crates/driver-mongo" }
rdbs-driver-sqlite = { path = "../crates/driver-sqlite" }
rdbs-driver-cassandra = { path = "../crates/driver-cassandra" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
serde_json = "1"
# permissive JSON for the Mongo editor: mongosh uses bare keys / single quotes
# (`{_id:-1}`), which strict serde_json rejects.
json5 = "0.4"
async-trait = "0.1"
# clipboard; already in the tree via Slint's winit backend, so no new builds
copypasta = "0.10"
# update check: one blocking GitHub GET (ureq, no async/TLS-stack bloat) +
# semver compare; `open` opens the release page cross-platform.
ureq = "2"
semver = "1"
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Set the Dock icon even for `cargo run`; macOS ignores a window icon on an
# unbundled executable. These crates are already in Slint's winit dependency tree.
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[build-dependencies]
slint-build = "1.8"
